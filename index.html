<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>VoicePulse AI - Enterprise QA & Compliance</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #38bdf8;
            margin-top: 0;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn.stop {
            background: #ef4444;
        }

        .btn.stop:hover {
            background: #dc2626;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #334155;
        }

        .compliant {
            border-left: 6px solid #22c55e;
        }

        .violation {
            border-left: 6px solid #ef4444;
            background: #450a0a;
        }

        .log-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #334155;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>VoicePulse AI 🎙️⚡</h1>
        <p>Enterprise Real-Time Sales QA & Compliance Monitoring Engine</p>
        <div>
            <button id="toggleBtn" class="btn" onclick="toggleMonitoring()">Start Live Call Monitoring</button>
        </div>
        <div id="statusBox" class="status-box compliant">
            <h3>Compliance Status: <span id="statusText">Idle</span></h3>
            <p><strong>AI Supervisor Whisper:</strong> <span id="whisperText">System ready for live call monitoring
                    session.</span></p>
        </div>
        <div class="log-box" id="logBox">Live transcriptions and risk evaluations will appear here...</div>
    </div>

    <script>
        let isRunning = false;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let socket = null;
        let reconnectAttempts = 0;
        const maxReconnects = 5;

        async function toggleMonitoring() {
            const btn = document.getElementById('toggleBtn');
            if (!isRunning) {
                try {
                    const res = await fetch('/api/token');
                    const data = await res.json();
                    if (!data.token) throw new Error("Failed to retrieve temporary V3 token");

                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(mediaStream);

                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    connectWebSocket(data.token);

                    processor.onaudioprocess = (e) => {
                        if (!socket || socket.readyState !== WebSocket.OPEN) return;
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                        }
                        socket.send(pcm16.buffer);
                    };

                    isRunning = true;
                    btn.textContent = "Stop Live Call Monitoring";
                    btn.className = "btn stop";
                    logMessage("Live monitoring session initiated successfully.");
                } catch (err) {
                    alert("Error starting monitoring: " + err.message);
                }
            } else {
                stopMonitoring();
            }
        }

        function connectWebSocket(token) {
            const wsUrl = `wss://streaming.assemblyai.com/v3/ws?speech_model=universal-3-5-pro&sample_rate=16000&encoding=pcm_s16le&token=${token}`;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                reconnectAttempts = 0;
                logMessage("Connected to AssemblyAI V3 Streaming WebSocket.");
            };

            socket.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "Turn" && msg.transcript) {
                    logMessage(`[Transcript]: ${msg.transcript}`);
                    await evaluateTranscript(msg.transcript);
                }
            };

            socket.onerror = (error) => {
                console.error("WebSocket Error:", error);
            };

            socket.onclose = (event) => {
                if (!event.wasClean && isRunning && reconnectAttempts < maxReconnects) {
                    reconnectAttempts++;
                    let timeout = Math.pow(2, reconnectAttempts) * 1000;
                    logMessage(`WebSocket disconnected. Reconnecting in ${timeout}ms...`);
                    setTimeout(() => connectWebSocket(token), timeout);
                }
            };
        }

        async function evaluateTranscript(text) {
            try {
                const res = await fetch('/api/qa/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const result = (await res.json()).evaluation_result;

                const box = document.getElementById('statusBox');
                const statusText = document.getElementById('statusText');
                const whisperText = document.getElementById('whisperText');

                statusText.textContent = result.detected_category;
                whisperText.textContent = result.supervisor_whisper;

                if (result.compliance_violation) {
                    box.className = "status-box violation";
                } else {
                    box.className = "status-box compliant";
                }
            } catch (err) {
                console.error("Evaluation error:", err);
            }
        }

        function stopMonitoring() {
            isRunning = false;
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (socket) socket.close();

            const btn = document.getElementById('toggleBtn');
            btn.textContent = "Start Live Call Monitoring";
            btn.className = "btn";
            document.getElementById('statusBox').className = "status-box compliant";
            document.getElementById('statusText').textContent = "Idle";
            document.getElementById('whisperText').textContent = "Session closed successfully.";
            logMessage("Monitoring session terminated.");
        }

        function logMessage(text) {
            const box = document.getElementById('logBox');
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>

</html>
